[package]
name = "accent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "accent-cli"
path = "src/main.rs"

[dependencies]
accent-core.workspace = true
accent-api.workspace = true
anyhow.workspace = true
# The times `list_dir` and `recent_changes` answer with; core's own.
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
# `mcp`: the Model Context Protocol over stdio, on the process's one runtime (`accent-lsp`).
rmcp = { version = "3.5", features = ["transport-io"] }
accent-lsp.workspace = true
tokio.workspace = true
serde.workspace = true
# What `read_note` hands an image in as; rmcp's own.
base64 = "0.23"
# The terminal holder: ptys and signals, and a screen model to redraw a shell on reattach.
libc = "0.2"
vt100 = "0.16"

[dev-dependencies]
# The opt-in remote test drives the real backend.
accent-api.workspace = true
# The serve test speaks the protocol by hand, which is the point: it checks the wire, not our
# own client.
serde_json.workspace = true
