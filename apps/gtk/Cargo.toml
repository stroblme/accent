[package]
name = "accent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "accent"
path = "src/main.rs"

[features]
default = ["webkit", "termprops"]
# The `ACCENT_BENCH_*` drills (`src/bench/`) and what only they call. Off in a shipped build;
# `make smoke`, `make check` and CI turn it on. Several load a page, so they need WebKit.
bench = ["webkit"]
# WebKitGTK 6.0, which nothing packages for macOS: the rendered preview and a note's print and
# export. Without it the preview is a status page.
webkit = ["dep:webkit6"]
# VTE 0.78's termprops: a program's OSC 52 copy, and the shell's commands and prompts reported to
# the tab. Without it accent builds against VTE 0.76, MacPorts' on macOS 12.
termprops = ["vte4-sys/v0_78"]

[dependencies]
# The library is dlopen()ed at runtime and its absence degrades to a status page, so this
# does not make libpdfium a build requirement (see accent_core::pdf::available).
accent-core = { workspace = true, features = ["pdf"] }
# `pdf` for the `[[paper.pdf#` completion, which reads the document's outline.
accent-api = { workspace = true, features = ["pdf"] }
accent-drawio.workspace = true
# Formulas laid out natively, in a math font the system HarfBuzz reads (`math`).
accent-math.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
# gtk's own cairo, with the surfaces a diagram is exported onto (`diagram::render`).
cairo-rs = { version = "0.22", features = ["pdf", "svg", "png", "v1_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
webkit6 = { version = "0.6", optional = true }
# WebKit's own HTTP library, for the pictures a diagram links from the web (`diagram::web`).
soup3 = "0.9"
# v0_76 for the context menu model and `check_match_at`; v0_78 deprecates `current_directory_uri`
# and would fail the clippy gate, so the one 0.78 call, `vte_install_termprop` (a shell's OSC 52
# copy, `terminal::install_termprops`), comes from the sys crate under the `termprops` feature.
# The build floor is libvte 0.78, 0.76 without `termprops`.
vte4 = { version = "0.10", features = ["v0_76"] }
vte4-sys = "0.10"
libspelling = "0.5"
# Only for "now" when expanding templates; core takes a NaiveDateTime.
chrono.workspace = true
# `accent-cli held` answers in JSON lines.
serde_json.workspace = true
# Hover documentation arrives as markdown and Pango wants markup; only the pull parser is needed.
pulldown-cmark.workspace = true
# The Git pane's lists splice only the rows a refresh changed (`git::changed_runs`); core's too.
similar = { version = "3", default-features = false }
# Already in the lock through core; where the Debug Console's prompt puts the cursor, a wide
# character taking two columns (`debug::line`).
unicode-width = "0.2"
# The vault's events reach the main loop through a channel it awaits (`events::start_events`).
# Already built for gio; `recv` is from 0.3.34.
futures-channel = "0.3.34"

[build-dependencies]
# Compiles the completion-kind icons into the binary's GResource.
glib-build-tools = "0.22"

[dev-dependencies]
tempfile.workspace = true
