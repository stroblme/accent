# Android 15 runs some devices with 16 KB memory pages, and a shared library laid out for 4 KB
# will not load there at all. NDK r27 links 16 KB-aligned by default; NDK 25, which this machine
# has, does not, so the flag says it. Harmless on a 4 KB device: the pages are just further apart
# in the file.
#
# Desktop targets are untouched — this file only names the two Android ones.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
