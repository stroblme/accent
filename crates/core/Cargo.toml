[package]
name = "accent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
pdf = ["dep:pdfium-render"]

[dependencies]
# A diagram's labels are what the index holds of it (`index::reconcile`), read through the model.
accent-drawio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
# fzf's matching algorithm, for everything that narrows a list by a typed query: the palette,
# the Android file switcher and the note completion popup all score through `fuzzy`.
nucleo-matcher = "0.3"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
tempfile.workspace = true
# `simd` for the scanner and `html` for the preview, on top of the workspace's plain parser.
pulldown-cmark = { workspace = true, features = ["simd", "html"] }
pulldown-latex = "0.8"
# regex-automata and regex-syntax are already compiled in for `ignore`/`globset`, so the front end
# is the only new code this pulls: it is what gives search its Regular Expression mode.
regex = "1"
# Already compiled in for `regex`; its `memmem` is what looks for a gitlink's mode in the index
# (`git::may_hold_gitlink`) without a process.
memchr = "2"
blake3.workspace = true
toml = "1"
# `std` for the clock: without it every deadline the word diff is given is ignored.
similar = { version = "3", default-features = false, features = ["std", "text", "inline"] }
chrono.workspace = true
# `setsid` and `kill` for git's process group: a git stopped part way takes its hooks and its ssh
# with it (`git::bounded`).
libc = "0.2"
# Already compiled in for `accent-drawio`; it inflates a `.synctex.gz` (`synctex`).
miniz_oxide = "0.9"
# Already in the lock through `vt100`; a table cell's width in columns (`markdown::table`), a wide
# character taking two.
unicode-width = "0.2"
# Held at 0.9.3: 0.9.4 makes `PdfiumLibraryBindingsAccessor` crate-private again, and the raw calls
# pdfium-render does not wrap (`/InkList` in `pdf::annot`, `FPDF_MovePages` in `pdf::pages`) reach
# pdfium through it.
pdfium-render = { version = "=0.9.3", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe"] }

[dev-dependencies]
# The examples' own errors: repo tooling, which matches on none of them.
anyhow.workspace = true
tempfile.workspace = true

# `cargo test` builds examples too, so this one must not be built without its feature.
[[example]]
name = "pdf_spike"
required-features = ["pdf"]

# Repo tooling, not a library target (see the example's own docs). `test = true` keeps its unit
# tests in `cargo test`, which is where they were before it moved out of accent-cli.
[[example]]
name = "gen-vault"
test = true
