[package]
name = "accent-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The uniffi bindings Android calls this crate through. Off for every desktop build, so
# `cargo build` never compiles uniffi and the façade stays what it was.
android = ["dep:uniffi", "dep:nucleo-matcher", "dep:thiserror", "accent-core/pdf"]

[dependencies]
accent-core.workspace = true
accent-lsp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `template::render` and `template::strftime` take a `NaiveDateTime`, and core re-exports nothing:
# same crate, same features as core so the two agree on one chrono.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# `ssh` names a control socket and the uploaded server binary by content hash; same version as
# core so the two agree on one blake3.
blake3 = "1"

# The Android bindings. `crates/api` is the façade Android calls, so the annotations live here;
# the cdylib that carries them is `android/ffi`, which a desktop build never touches.
uniffi = { version = "0.32", optional = true }
thiserror = { workspace = true, optional = true }
# The file switcher's ranking, the same matcher the desktop palette uses.
nucleo-matcher = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
