[package]
name = "accent-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Reading a PDF's outline, which is what `[[paper.pdf#` completes against. Off by default so a
# build with no pdfium binding is still a build; without it that one completion offers nothing.
pdf = ["accent-core/pdf"]
# The uniffi bindings Android calls this crate through. Off for every desktop build, so
# `cargo build` never compiles uniffi and the façade stays what it was.
android = ["pdf", "dep:uniffi", "dep:thiserror"]

[dependencies]
accent-core.workspace = true
# A Replace All rewrites a diagram's labels through its model, never its XML.
accent-drawio.workspace = true
accent-lsp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `template::render` and `template::strftime` take a `NaiveDateTime`, and core re-exports nothing.
chrono.workspace = true
# `ssh` names a control socket and the uploaded server binary by content hash.
blake3.workspace = true
# Already built for `ignore`: a language server's `willRename` filters are globs.
globset = "0.4"

# The Android bindings. `crates/api` is the façade Android calls, so the annotations live here;
# the cdylib that carries them is `android/ffi`, which a desktop build never touches.
uniffi = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
