[package]
name = "accent-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# android = ["dep:uniffi"]  # enabled in Phase 3

[dependencies]
accent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `template::render` and `template::strftime` take a `NaiveDateTime`, and core re-exports nothing:
# same crate, same features as core so the two agree on one chrono.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
