[workspace]
resolver = "3"
members = ["crates/core", "crates/lsp", "crates/dap", "crates/jupyter", "crates/api", "crates/drawio", "crates/math", "crates/pdf", "apps/cli", "apps/gtk", "android/ffi"]
# apps/gtk needs gtk4/libadwaita dev headers; build it explicitly with `cargo build -p accent`.
# crates/math links the system HarfBuzz (8.3.1 or newer), a desktop dependency as apps/gtk's are.
# android/ffi is cross-compiled for the phone by `make android`, never by a desktop build.
default-members = ["crates/core", "crates/lsp", "crates/dap", "crates/jupyter", "crates/api", "crates/drawio", "crates/pdf", "apps/cli"]

[workspace.package]
version = "3.0.2"
edition = "2024"
# 1.95 for `use super::{self as …}` (apps/gtk/src/pdf); the dependencies alone ask 1.92.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/stroblme/accent"

[workspace.dependencies]
accent-core = { path = "crates/core" }
accent-lsp = { path = "crates/lsp" }
accent-dap = { path = "crates/dap" }
accent-jupyter = { path = "crates/jupyter" }
accent-api = { path = "crates/api" }
accent-drawio = { path = "crates/drawio" }
accent-math = { path = "crates/math" }
accent-pdf = { path = "crates/pdf" }
anyhow = "1"
thiserror = "2"
# One runtime for the language servers now and the MCP server later; `crates/lsp` owns it.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
blake3 = "1"
tempfile = "3"
uniffi = "0.32"
# The GTK app parses markdown without the core's extensions; `accent-core` adds them.
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# accent-cli is also the server a remote vault uploads, so it is built for size: `mcp` (rmcp and
# the serde code it instantiates here) took the x86_64 musl binary from 9.0 to 11.2 MB at -O3, to
# 10.0 MB like this. `serve`'s list_dir, read_text and search, and `hold`'s streaming and replay,
# timed the same within noise (2026-10-08). The core and the façade it links stay at -O3.
[profile.release.package.accent-cli]
opt-level = "s"
[profile.release.package.rmcp]
opt-level = "s"

# What ships: `make install`, the packages, Accent.app, the uploaded servers, the Flatpak, Nix and
# the release APKs (`android-dist`), while every build a developer checks with stays on release
# (user decision 2026-11-13). Full LTO and the serialization and command-handling crates for size
# took the stripped app from 26.6 to 24.6 MB, accent-cli from 14.5 to 12.7 MB, the x86_64 server
# from 13.6 to 11.9 MB and the arm64 Android library from 8.2 to 7.6 MB, with cold indexing of the
# generated vault and typing timing the same within noise (2026-11-13, six interleaved rounds).
# Full LTO lengthens the app's build by about half, hence a profile of its own. Either half alone
# saved less, and these crates at "s" under thin LTO cost typing about 10 %.
[profile.dist]
inherits = "release"
lto = "fat"
[profile.dist.package.accent-api]
opt-level = "s"
[profile.dist.package.serde_json]
opt-level = "s"
[profile.dist.package.toml]
opt-level = "s"
[profile.dist.package.toml_parser]
opt-level = "s"
[profile.dist.package.toml_writer]
opt-level = "s"
[profile.dist.package.toml_edit]
opt-level = "s"
[profile.dist.package.toml_datetime]
opt-level = "s"
[profile.dist.package.clap_builder]
opt-level = "s"
[profile.dist.package.clap_lex]
opt-level = "s"

# The Android core, built for speed as the desktop's is: a vault's first index is the one slow
# thing the app does, and it is CPU-bound on one core. `opt-level = "z"` cost it ~15 % on the host
# (2026-10-14, the generated vault: 9.7 against 8.4 s of CPU), for a smaller download: the
# stripped arm64 library is 7.4 MB here, 5.7 MB at "z". `make android` and the cross build
# Gradle runs itself both name this profile; nothing else does. The symbol table it strips is
# where uniffi keeps its metadata, which is why `make bindings` reads a host build instead.
[profile.android]
inherits = "release"
opt-level = 3
strip = "symbols"
# The same for the release APKs (`make apk-release`), on dist's settings.
[profile.android-dist]
inherits = "dist"
opt-level = 3
strip = "symbols"
