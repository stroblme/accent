[workspace]
resolver = "3"
members = ["crates/core", "crates/lsp", "crates/api", "apps/cli", "apps/gtk"]
# apps/gtk needs gtk4/libadwaita dev headers; build it explicitly with `cargo build -p accent`
default-members = ["crates/core", "crates/lsp", "crates/api", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/stroblme/accent"

[workspace.dependencies]
accent-core = { path = "crates/core" }
accent-lsp = { path = "crates/lsp" }
accent-api = { path = "crates/api" }
anyhow = "1"
thiserror = "2"
# One runtime for the language servers now and the MCP server later; `crates/lsp` owns it.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
