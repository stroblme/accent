[workspace]
resolver = "3"
members = ["crates/core", "crates/lsp", "crates/dap", "crates/jupyter", "crates/api", "crates/drawio", "crates/math", "apps/cli", "apps/gtk", "android/ffi"]
# apps/gtk needs gtk4/libadwaita dev headers; build it explicitly with `cargo build -p accent`.
# crates/math links the system HarfBuzz (8.3.1 or newer), a desktop dependency as apps/gtk's are.
# android/ffi is cross-compiled for the phone by `make android`, never by a desktop build.
default-members = ["crates/core", "crates/lsp", "crates/dap", "crates/jupyter", "crates/api", "crates/drawio", "apps/cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
# 1.95 for `use super::{self as …}` (apps/gtk/src/pdf); the dependencies alone ask 1.92.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/stroblme/accent"

[workspace.dependencies]
accent-core = { path = "crates/core" }
accent-lsp = { path = "crates/lsp" }
accent-dap = { path = "crates/dap" }
accent-jupyter = { path = "crates/jupyter" }
accent-api = { path = "crates/api" }
accent-drawio = { path = "crates/drawio" }
accent-math = { path = "crates/math" }
anyhow = "1"
thiserror = "2"
# One runtime for the language servers now and the MCP server later; `crates/lsp` owns it.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
blake3 = "1"
tempfile = "3"
uniffi = "0.32"
# The GTK app parses markdown without the core's extensions; `accent-core` adds them.
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# accent-cli is also the server a remote vault uploads, so it is built for size: `mcp` (rmcp and
# the serde code it instantiates here) took the x86_64 musl binary from 9.0 to 11.2 MB at -O3, to
# 10.0 MB like this. `serve`'s list_dir, read_text and search, and `hold`'s streaming and replay,
# timed the same within noise (2026-10-08). The core and the façade it links stay at -O3.
[profile.release.package.accent-cli]
opt-level = "s"
[profile.release.package.rmcp]
opt-level = "s"

# The Android core, built for speed as the desktop's is: a vault's first index is the one slow
# thing the app does, and it is CPU-bound on one core. `opt-level = "z"` cost it ~15 % on the host
# (2026-10-14, the generated vault: 9.7 against 8.4 s of CPU), for a smaller download: the
# stripped arm64 library is 7.4 MB here, 5.7 MB at "z". `make android` and the cross build
# Gradle runs itself both name this profile; nothing else does. The symbol table it strips is
# where uniffi keeps its metadata, which is why `make bindings` reads a host build instead.
[profile.android]
inherits = "release"
opt-level = 3
strip = "symbols"
