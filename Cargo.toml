[workspace]
resolver = "3"
members = ["crates/core", "crates/lsp", "crates/api", "crates/drawio", "apps/cli", "apps/gtk", "android/ffi"]
# apps/gtk needs gtk4/libadwaita dev headers; build it explicitly with `cargo build -p accent`.
# android/ffi is cross-compiled for the phone by `make android`, never by a desktop build.
default-members = ["crates/core", "crates/lsp", "crates/api", "crates/drawio", "apps/cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/stroblme/accent"

[workspace.dependencies]
accent-core = { path = "crates/core" }
accent-lsp = { path = "crates/lsp" }
accent-api = { path = "crates/api" }
accent-drawio = { path = "crates/drawio" }
anyhow = "1"
thiserror = "2"
# One runtime for the language servers now and the MCP server later; `crates/lsp` owns it.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
blake3 = "1"
tempfile = "3"
uniffi = "0.32"
# The GTK app parses markdown without the core's extensions; `accent-core` adds them.
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# The Android core, built for size rather than speed: the `.so` is the download, and the desktop
# app shares `release` above and wants the other trade. `make android` and the cross build Gradle
# runs itself both name this profile; nothing else does. Measured on the arm64 library, 8.7 MB
# before: 6.9 MB stripped, 5.2 MB stripped and built for size. The symbol table it drops is where
# uniffi keeps its metadata, which is why `make bindings` reads a host build instead.
[profile.android]
inherits = "release"
opt-level = "z"
strip = "symbols"
