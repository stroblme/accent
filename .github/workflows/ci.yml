name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core + api + cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-analyzer (with rust-src, the std it reads) is for accent-api's end-to-end LSP tests.
      # Without the component rustup's `rust-analyzer` proxy is still on PATH, so the tests do
      # not skip: the proxy exits at once and they fail.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      # `--all` covers apps/gtk as well: rustfmt only parses the sources, it never resolves
      # dependencies, so the missing GTK dev headers on this runner do not matter.
      - run: cargo fmt --all --check
      # apps/gtk links gtk4, libadwaita, gtksourceview5, webkit6 and libspelling, whose -devel
      # packages ubuntu-latest does not carry. The gtk job below lints and tests it instead.
      - run: cargo clippy --workspace --exclude accent --all-targets --locked --features accent-core/pdf -- -D warnings
      # Without --no-fail-fast the first failing test binary hides every crate after it.
      - run: cargo test --locked --no-fail-fast
      # The PDF tests skip themselves when libpdfium is missing, so without this the job would
      # pass without running any of them. `make test-pdf` would fetch it too; a separate step
      # keeps a download failure distinguishable from a test failure.
      - run: make pdfium
      - run: make test-pdf

  gtk:
    name: desktop app
    runs-on: ubuntu-latest
    # Ubuntu 24.04 ships libadwaita 1.5, older than the v1_7 feature the app is built against.
    # Fedora 44 packages the whole current GNOME stack, so it is the cheapest runner that links.
    container: fedora:44
    steps:
      # Before checkout: the base image has no git, so actions/checkout would fall back to the API.
      # make, tar and curl are for `make pdfium`; the image already carries tar and the full curl.
      # dbus-daemon is for `make smoke`'s dbus-run-session.
      - run: >
          dnf install -y git gcc make tar curl gtk4-devel libadwaita-devel
          gtksourceview5-devel webkitgtk6.0-devel libspelling-devel vte291-gtk4-devel
          xorg-x11-server-Xvfb dbus-daemon
          dejavu-sans-fonts
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # accent enables accent-core's `pdf` feature, which dlopen()s the library at runtime, so
      # the smoke run needs it present to exercise anything but the degraded path.
      - run: make pdfium
      # Twice: as it ships, and with the `ACCENT_BENCH_*` drills compiled in.
      - run: cargo clippy -p accent --locked -- -D warnings
      - run: cargo clippy -p accent --locked --features bench -- -D warnings
      - run: cargo test -p accent --locked --no-fail-fast
      # With the drills, which is the build `make smoke` runs.
      - run: cargo build --release --locked -p accent -p accent-cli --features accent/bench
      # The generator is a core example, not a CLI subcommand; `make vault` is its only caller.
      - run: make vault VAULT_NOTES=200 VAULT_FILES=2000
      # The Makefile is the one definition of the gate's environment: XVFB_ENV, the private bus
      # and the scratch XDG dirs. It reuses the vault above, which is newer than its generator.
      - name: Headless smoke run
        run: make smoke
      # Multi-caret's regression cover, on the Xvfb and the build the smoke run left behind.
      - name: Asserting drills
        run: make drills

  android:
    name: android app
    runs-on: ubuntu-latest
    env:
      # AGP 9.4's default NDK, so Gradle strips the libraries with the same NDK cargo-ndk linked
      # them with. r27+ links 16 KB pages by default; `.cargo/config.toml` asks for them anyway.
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5
      # rust-analyzer and rust-src: `make android-check` runs accent-api's LSP tests too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer, rust-src
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Restores ~/.gradle/caches and ~/.gradle/wrapper and saves them after the job; it needs no
      # project path, as its init scripts apply to any later Gradle run. `basic` is the MIT
      # provider; the default is proprietary. Its key hashes `**/*.gradle*`, the wrapper properties and a
      # root-level `gradle/*.versions.toml`, so a bump in `android/gradle/libs.versions.toml`
      # alone keeps the old entry and downloads the new versions on every run.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The action installs only platform-tools by default. These are what the build reads:
      # `compileSdk` 37.2, AGP 9.4's default build-tools, the NDK.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}
          # Otherwise every licence is printed in full, some 800 lines ahead of the build's own.
          log-accepted-android-sdk-licenses: false
      # For cargo-ndk and the Makefile's readelf. The runner's own pair points at r27, and
      # cargo-ndk warns when the two disagree.
      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      # fmt, clippy and the ffi tests on the host, then both cross builds, then the 16 KB
      # alignment check over every library the APK will carry.
      - run: make android-check
      - run: make pdfium-android
      - run: make apk
      - run: make android-test
