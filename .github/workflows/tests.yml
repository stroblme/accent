name: Tests

# Branches only: a tag runs these through release.yml, which publishes nothing unless they pass.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core + api + cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-analyzer (with rust-src, the std it reads) is for accent-api's end-to-end LSP tests.
      # Without the component rustup's `rust-analyzer` proxy is still on PATH, so the tests do
      # not skip: the proxy exits at once and they fail.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      # `--all` covers apps/gtk as well: rustfmt only parses the sources, it never resolves
      # dependencies, so the missing GTK dev headers on this runner do not matter.
      - run: cargo fmt --all --check
      # apps/gtk links gtk4, libadwaita, gtksourceview5, webkit6 and libspelling, whose -devel
      # packages ubuntu-latest does not carry. The gtk job below lints and tests it instead.
      - run: cargo clippy --workspace --exclude accent --all-targets --locked --features accent-core/pdf -- -D warnings
      # debugpy is for accent-api's end-to-end debugger tests and ipykernel for accent-jupyter's
      # kernel test, which skip themselves without them: the distribution's, ipykernel 6 with
      # its PUB IOPub socket (the gtk job's 7 has XPUB).
      - run: sudo apt-get update && sudo apt-get install -y python3-debugpy python3-ipykernel
      # Without --no-fail-fast the first failing test binary hides every crate after it.
      - run: cargo test --locked --no-fail-fast
      # The PDF tests skip themselves when libpdfium is missing, so without this the job would
      # pass without running any of them. `make test-pdf` would fetch it too; a separate step
      # keeps a download failure distinguishable from a test failure.
      - run: make pdfium
      - run: make test-pdf

  gtk:
    name: desktop app
    runs-on: ubuntu-latest
    # Ubuntu 24.04 ships libadwaita 1.5, older than the v1_8 feature the app is built against.
    # Fedora 44 packages the whole current GNOME stack, so it is the cheapest runner that links.
    container: fedora:44
    steps:
      # Before checkout: the base image has no git, so actions/checkout would fall back to the API.
      # make runs the next step; tar is for `make pdfium` (the image already carries it); the rest
      # is the headless run's: dbus-daemon for `make smoke`'s dbus-run-session.
      - run: dnf install -y git make tar xorg-x11-server-Xvfb dbus-daemon dejavu-sans-fonts
      - uses: actions/checkout@v7
      # The build requirements, from the Makefile's one list; as root, without sudo.
      - run: make install-requirements
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # accent enables accent-core's `pdf` feature, which dlopen()s the library at runtime, so
      # the smoke run needs it present to exercise anything but the degraded path.
      - run: make pdfium
      # Twice: as it ships, and with the `ACCENT_BENCH_*` drills compiled in.
      - run: cargo clippy -p accent --locked -- -D warnings
      - run: cargo clippy -p accent --locked --features bench -- -D warnings
      - run: cargo test -p accent --locked --no-fail-fast
      # With the drills, which is the build `make smoke` runs.
      - run: cargo build --release --locked -p accent -p accent-cli --features accent/bench
      # The generator is a core example, not a CLI subcommand; `make vault` is its only caller.
      - run: make vault VAULT_NOTES=200 VAULT_FILES=2000
      # The Makefile is the one definition of the gate's environment: XVFB_ENV, the private bus
      # and the scratch XDG dirs. It reuses the vault above, which is newer than its generator.
      - name: Headless smoke run
        run: make smoke
      # debugpy for the debugger drill and ipykernel for the kernel drill, which `make drills`
      # skips without them. pip, as root, into /usr/local: the drills run under a scratch HOME,
      # where a `--user` install would not be found. debugpy is pinned to the one the debugger
      # was measured with, ipykernel to 7.4, whose XPUB IOPub and protocol 5.5 the Ubuntu job's
      # ipykernel 6 does not have.
      - run: dnf install -y python3-pip && python3 -m pip install debugpy==1.8.22 ipykernel==7.4.0
      # Multi-caret's regression cover, on the Xvfb and the build the smoke run left behind.
      - name: Asserting drills
        run: make drills

  macos:
    name: macOS desktop app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # WebKitGTK is unavailable on macOS; this builds the native desktop dependencies.
      - run: brew install pkgconf gtk4 libadwaita gtksourceview5 vte3 libspelling libsoup
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p accent --no-default-features --locked
      - run: cargo test -p accent-core --locked --no-fail-fast

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android
      # fmt, clippy and the ffi tests on the host, then both cross builds, then the 16 KB
      # alignment check over every library the APK will carry.
      - run: make android-check
      - run: make pdfium-android
      - run: make apk
      - run: make android-test
