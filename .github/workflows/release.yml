name: Release

# Three numbers, so the APK's versionCode below can be read off the tag.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  apk:
    name: android app
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android
      # Gradle reads ORG_GRADLE_PROJECT_* as project properties (`android/app/build.gradle.kts`).
      # Android installs an update only over a lower versionCode, so it has to grow with the tag.
      - name: Version from the tag
        run: |
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          echo "ORG_GRADLE_PROJECT_versionName=$major.$minor.$patch" >> "$GITHUB_ENV"
          # ponytail: two digits each for minor and patch; widen once either passes 99.
          echo "ORG_GRADLE_PROJECT_versionCode=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - run: make apk-release
      # With the repository's keystore, so each release installs over the last. It holds one key,
      # so apksigner needs no alias, and that key shares the store's password.
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::the ANDROID_KEYSTORE secret is not set"; exit 1; }
          base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/release.jks"
          for apk in android/app/build/outputs/apk/release/app-*-release-unsigned.apk; do
            abi=$(basename "$apk" -release-unsigned.apk)
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --out "accent-$GITHUB_REF_NAME-${abi#app-}.apk" "$apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: accent-apk
          path: accent-*.apk
          if-no-files-found: error

  flatpak:
    name: desktop app
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/io.github.stroblme.Accent.yml
          bundle: accent-${{ github.ref_name }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  # The static servers a remote vault uploads, for Accent.app to carry; macOS has no musl
  # toolchain of its own. Not named accent-*, so the release below leaves them out.
  server:
    name: remote servers
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The Makefile's own recipe for cargo-zigbuild and zig, without root.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: |
          uv tool install cargo-zigbuild
          ln -s "$(uv tool dir)/cargo-zigbuild/bin/python-zig" "$(uv tool dir --bin)/zig"
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: make server
      - uses: actions/upload-artifact@v7
        with:
          name: servers
          path: target/*-unknown-linux-musl/release/accent-cli*
          if-no-files-found: error

  # Homebrew's bottles are built for the runner's macOS, so that is the app's minimum
  # (LSMinimumSystemVersion). macos-15-intel is the last Intel image GitHub offers.
  dmg:
    name: macOS app (${{ matrix.os }})
    needs: [tests, server]
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # tests.yml's list, plus what `build-aux/macos-bundle.sh` copies in: the SVG loader and
      # rsvg-convert, GIO's TLS module, the icons and the interface schemas.
      - run: |
          brew install pkgconf gtk4 libadwaita gtksourceview5 vte3 libspelling libsoup \
            librsvg glib-networking adwaita-icon-theme gsettings-desktop-schemas
      - uses: dtolnay/rust-toolchain@stable
      # Where `make server` leaves them, which is where the bundle script looks.
      - uses: actions/download-artifact@v8
        with:
          name: servers
          path: target
      - run: make dmg VERSION="${GITHUB_REF_NAME#v}"
      # dyld resolves every library at launch, so this fails on one the bundle lacks; `--help`
      # exits before GTK opens a window.
      - run: target/release/Accent.app/Contents/MacOS/accent --help
      - uses: actions/upload-artifact@v7
        with:
          name: accent-${{ matrix.os }}
          path: target/release/accent-*.dmg
          if-no-files-found: error

  release:
    needs: [apk, flatpak, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The Flatpak action names its artifact after the bundle.
      - uses: actions/download-artifact@v8
        with:
          pattern: accent-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" accent-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
