<!-- The private session bus of a headless launch (`HEADLESS` in the Makefile): no service
     directories, so nothing on it can start a service. On the standard one GTK, libadwaita and
     GLib in WebKit's sandbox each start xdg-desktop-portal, whose document portal unmounts the
     user's; and WebKit's web process can finish connecting to the a11y bus after a quitting
     drill has closed it, which G_DEBUG=fatal-criticals turns into an abort. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
