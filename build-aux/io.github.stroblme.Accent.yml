id: io.github.stroblme.Accent
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: accent

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Vaults are Syncthing folders holding directory symlinks into arbitrary host trees, and inotify
  # only fires on the real paths behind those symlinks. Neither the file chooser portal nor a
  # narrower --filesystem= can express "wherever the symlink target happens to live", so the app
  # needs the host filesystem.
  - --filesystem=host
  # Host commands (`flatpak-spawn --host`): a terminal tab's shell is the host's, held there by
  # the static accent-cli below (`terminal::host_cli`). Without it, the sandbox's shell.
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # cargo-sources.json unpacks the registry into <builddir>/cargo/vendor and writes the vendor
    # config to <builddir>/cargo/config, so CARGO_HOME has to be exactly that directory. The path
    # follows the module name below.
    CARGO_HOME: /run/build/accent/cargo

modules:
  # The GNOME 51 runtime ships enchant and hunspell but not libspelling, so the app has to build it.
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dintrospection=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b

  # The runtime has no libvte-2.91-gtk4 either. These three are Ptyxis's Flathub modules.
  - name: fast_float
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        tag: v8.2.5
        commit: 05087a303dad9c98768b33c829d398223a649bc6

  - name: simdutf
    buildsystem: cmake-ninja
    # Its tests are some 200 targets, a good part of the whole Flatpak build.
    config-opts:
      - -DSIMDUTF_TESTS=OFF
      - -DSIMDUTF_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        tag: v9.0.0
        commit: ca7acbcea967b5dcbab490066e99e3a6e6925539

  - name: vte
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dglade=false
      - -Dgir=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.0.tar.xz
        sha256: 0414e31583836aeb7878da25f67c515f7e8879917ecc37c92e26b83e8d8fc3e3

  # Cargo feature `pdf`. pdfium-render dlopen()s libpdfium.so at runtime and accent-core looks
  # next to the binary first (crates/core/src/pdf.rs), so /app/bin/accent finds /app/lib/accent
  # with no environment variable. Build 8076 and its checksums match the Makefile's `make pdfium`.
  # The archives have no top-level directory: lib/ and LICENSE sit at their root.
  - name: pdfium
    buildsystem: simple
    build-commands:
      - install -Dm755 lib/libpdfium.so -t /app/lib/accent
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8076/pdfium-linux-x64.tgz
        sha256: d9d67bc40af03aef4fe28a60b19b1086f28ace019c8c9caf19cb7fe3d14ceca3
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8076/pdfium-linux-arm64.tgz
        sha256: d7247b33ae5545615a5e877235dd97afc879e3a8805689684f528cae3339d352
        strip-components: 0

  # The tool the server below is built with, left out of the app.
  - name: cargo-zigbuild
    buildsystem: simple
    cleanup: ['*']
    build-options:
      env:
        CARGO_HOME: /run/build/cargo-zigbuild/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/cargo-zigbuild -t /app/bin
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://static.crates.io/crates/cargo-zigbuild/cargo-zigbuild-0.23.4.crate
        sha256: 0b0c2fe7d5f1a782047272e3fc1cd44214c450776bbde564bf92b9776dc2d781
      # Generated from the crate's Cargo.lock as cargo-sources.json is from ours.
      - cargo-zigbuild-sources.json

  - name: accent
    buildsystem: simple
    build-options:
      env:
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: --sysroot=/run/build/accent/sysroot
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: --sysroot=/run/build/accent/sysroot
        CARGO_ZIGBUILD_ZIG_PATH: /run/build/accent/zig/zig
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release -p accent
      # The server a remote vault uploads, static so it starts on any distribution, for this
      # machine's architecture only: Flathub refuses a build holding another's binaries, so a
      # host of the other one is refused (`link::Server::for_host`). The extension's sysroot is
      # read-only and has no musl std, so ours (the RUSTFLAGS above) adds it beside the host's,
      # and bundled SQLite wants a musl C compiler, which zig is.
      - mkdir -p sysroot/lib/rustlib
      - ln -s /usr/lib/sdk/rust-stable/lib/rustlib/*-linux-gnu "$PWD"/rust-std/*/lib/rustlib/*-musl sysroot/lib/rustlib
      # Without the SDK's CFLAGS, which the C compiler for musl does not take (-fcf-protection).
      - env -u CFLAGS cargo --offline zigbuild --release -p accent-cli --target $FLATPAK_ARCH-unknown-linux-musl
      - install -Dm755 target/$FLATPAK_ARCH-unknown-linux-musl/release/accent-cli /app/lib/accent/accent-cli-$FLATPAK_ARCH
      # Five install lines beat adding a meson build system that nothing else in the tree needs.
      - install -Dm755 target/release/accent -t /app/bin
      - install -Dm644 data/io.github.stroblme.Accent.desktop -t /app/share/applications
      - install -Dm644 data/io.github.stroblme.Accent.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.stroblme.Accent.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.stroblme.Accent-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: dir
        path: ..
        # target/ alone is several GB and would be copied into the build dir on every run.
        skip:
          - .codegraph
          - .flatpak-builder
          - .git
          - build-aux/build
          - target
          - testvault
          - testvault-external
          # `make pdfium`'s download; the module above brings the library. vendor/mermaid is source.
          - vendor/pdfium
      # Regenerate whenever Cargo.lock changes, see the command in the repo README/report.
      - cargo-sources.json
      # The server's std, from the release the rust-stable extension is (`rustc --version` in
      # the SDK): a std any other rustc built is refused, so these move with it.
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/2026-08-20/rust-std-1.98.0-x86_64-unknown-linux-musl.tar.xz
        sha256: 1a76f782db2d540e1cd16ea47829b323f4a8f4dda64bca4b23be189109c510f8
        dest: rust-std
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/2026-08-20/rust-std-1.98.0-aarch64-unknown-linux-musl.tar.xz
        sha256: 36f82e96e86ec8a02d0a0a66574f4b7be086771cec41bb8e9d40ba5cbd64c93a
        dest: rust-std
      # zig, for the machine building.
      - type: archive
        only-arches: [x86_64]
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        dest: zig
      - type: archive
        only-arches: [aarch64]
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        dest: zig
  # Compress after the accent module's ELF stripping, so the archive matches the shipped binary.
  - name: server-upload
    buildsystem: simple
    build-commands:
      - python3 compress-server.py /app/lib/accent/accent-cli-$FLATPAK_ARCH
    sources:
      - type: file
        path: compress-server.py
